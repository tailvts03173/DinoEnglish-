spring.application.name=DinoEnglish
server.port=8080

# Nhập file cấu hình cục bộ (chứa mật khẩu DB và Gmail đã được .gitignore)
spring.config.import=optional:classpath:application-local.properties

# Tắt hoàn toàn cấu hình tự động của JPA / SQL Server để chuyển sang MongoDB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# MongoDB: Tự động tạo index
spring.data.mongodb.auto-index-creation=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Gmail SMTP - dùng để gửi mã xác minh khi quên mật khẩu
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dinogreenenglish@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_USERNAME:dinogreenenglish@gmail.com}

# Tài khoản quản trị tạo lần chạy đầu
app.seed.admin-email=${ADMIN_EMAIL:dinogreenenglish4@gmail.com}
app.seed.admin-password=${ADMIN_PASSWORD:Dino123245@}
app.seed.manager-password=${MANAGER_PASSWORD:}
