spring.application.name=DinoEnglish
server.port=8080

# Bí mật (mật khẩu DB, mật khẩu Gmail) KHÔNG đặt ở đây.
# Đặt trong application-local.properties (đã được .gitignore) hoặc biến môi trường DB_PASSWORD, MAIL_PASSWORD.
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (Microsoft SQL Server)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DinoEnglishDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
# "update" tiện cho phát triển; môi trường thật nên đặt DDL_AUTO=validate và quản lý schema bằng migration.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Gmail SMTP - dùng để gửi mã xác minh khi quên mật khẩu
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dinogreenenglish@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_USERNAME:dinogreenenglish@gmail.com}

# Tài khoản quản trị tạo lần chạy đầu. Để trống mật khẩu => hệ thống sinh ngẫu nhiên và in ra log MỘT lần.
app.seed.admin-email=${ADMIN_EMAIL:dinogreenenglish@gmail.com}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.manager-password=${MANAGER_PASSWORD:}
