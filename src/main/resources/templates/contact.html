<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Liên Hệ & Hỗ Trợ - Dino English')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-dino p-4 p-md-5 border-0 shadow-sm">
                    <div class="text-center mb-4">
                        <img th:src="@{/images/dino-logo.png}" alt="Dino Mascot" style="height: 80px;" class="mb-2">
                        <h2 class="fw-bold mb-1">Liên Hệ Với Dino English</h2>
                        <p class="text-secondary small">Chúng tôi luôn sẵn sàng lắng nghe mọi góp ý và hỗ trợ học viên 24/7!</p>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-4 text-center p-3 rounded-4 bg-light">
                            <i class="fa-solid fa-envelope fs-2 text-primary mb-2"></i>
                            <h6 class="fw-bold mb-1">Email</h6>
                            <p class="small text-muted mb-0">support@dinoenglish.edu.vn</p>
                        </div>
                        <div class="col-md-4 text-center p-3 rounded-4 bg-light">
                            <i class="fa-solid fa-phone fs-2 text-success mb-2"></i>
                            <h6 class="fw-bold mb-1">Hotline</h6>
                            <p class="small text-muted mb-0">0987 654 321</p>
                        </div>
                        <div class="col-md-4 text-center p-3 rounded-4 bg-light">
                            <i class="fa-solid fa-location-dot fs-2 text-danger mb-2"></i>
                            <h6 class="fw-bold mb-1">Địa chỉ</h6>
                            <p class="small text-muted mb-0">Hà Nội, Việt Nam</p>
                        </div>
                    </div>

                    <form onsubmit="alert('Cảm ơn bạn đã gửi phản hồi! Dino English sẽ phản hồi bạn trong thời gian sớm nhất.'); return false;">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Họ và tên</label>
                                <input type="text" class="form-control rounded-pill" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Email liên hệ</label>
                                <input type="email" class="form-control rounded-pill" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-secondary">Tiêu đề thắc mắc</label>
                                <input type="text" class="form-control rounded-pill" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-secondary">Nội dung chi tiết</label>
                                <textarea class="form-control rounded-4" rows="4" required></textarea>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-dino px-4">
                                <i class="fa-solid fa-paper-plane me-1"></i> Gửi Tin Nhắn
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
