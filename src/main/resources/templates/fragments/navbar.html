<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - Dino English' : 'Dino English - Học tiếng Anh mỗi ngày!'}">Dino English</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Baloo 2 & Nunito (Full Vietnamese Diacritics Support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&subset=vietnamese&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Dino CSS -->
    <link rel="stylesheet" th:href="@{/css/dino.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dino sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <img th:src="@{/images/dino-logo.png}" alt="Dino English Logo" class="navbar-brand-logo">
            <span class="brand-font fs-4 text-dino-dark-green">Dino English</span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="fa-solid fa-house me-1"></i> Trang Chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/courses}"><i class="fa-solid fa-graduation-cap me-1"></i> Khóa Học</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/streak}"><i class="fa-solid fa-fire text-danger me-1"></i> Chuỗi Học (Streak)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/leaderboard}"><i class="fa-solid fa-trophy text-warning me-1"></i> Xếp Hạng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/documents}"><i class="fa-solid fa-folder-open text-primary me-1"></i> Kho Tài Liệu</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- Guest View -->
                <div th:if="${currentUser == null}" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-dino-outline">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập
                    </a>
                    <a th:href="@{/register}" class="btn btn-dino">
                        <i class="fa-solid fa-user-plus me-1"></i> Đăng Ký
                    </a>
                </div>

                <!-- Logged In View -->
                <div th:if="${currentUser != null}" class="d-flex align-items-center gap-3">
                    <!-- Streak Pill -->
                    <a th:href="@{/user/streak}" class="streak-pill text-decoration-none" title="Chuỗi ngày học liên tục">
                        <i class="fa-solid fa-fire"></i>
                        <span th:text="${currentUser.currentStreak}">0</span> ngày
                    </a>

                    <!-- XP Pill -->
                    <span class="xp-pill" title="Tổng điểm kinh nghiệm XP">
                        <i class="fa-solid fa-star"></i>
                        <span th:text="${currentUser.totalXp}">0</span> XP
                    </span>

                    <!-- User Dropdown Menu -->
                    <div class="dropdown">
                        <button class="btn btn-light rounded-pill border d-flex align-items-center gap-2 dropdown-toggle py-1 px-2" type="button" data-bs-toggle="dropdown">
                            <img th:src="${currentUser.avatarUrl != null ? currentUser.avatarUrl : '/images/dino-logo.png'}"
                                 alt="Avatar" class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">
                            <span class="fw-bold small d-none d-md-inline" th:text="${currentUser.fullName}">Tên người dùng</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 mt-2 p-2">
                            <li class="px-3 py-2 border-bottom">
                                <div class="fw-bold" th:text="${currentUser.fullName}">Người dùng</div>
                                <div class="small text-muted" th:text="${currentUser.getDinoRank()}">Baby Dino</div>
                                <span class="badge bg-success mt-1" th:text="${currentUser.role.displayName}">Vai trò</span>
                            </li>

                            <!-- Admin Shortcut -->
                            <li th:if="${currentUser.role.name() == 'ADMIN'}">
                                <a class="dropdown-item rounded-3 py-2 text-danger fw-bold" th:href="@{/admin/dashboard}">
                                    <i class="fa-solid fa-shield-halved me-2"></i> Trang Quản Trị Admin
                                </a>
                            </li>

                            <!-- Manager Shortcut -->
                            <li th:if="${currentUser.role.name() == 'MANAGER' or currentUser.role.name() == 'ADMIN'}">
                                <a class="dropdown-item rounded-3 py-2 text-primary fw-bold" th:href="@{/manager/dashboard}">
                                    <i class="fa-solid fa-pen-to-square me-2"></i> Quản Lý Nội Dung
                                </a>
                            </li>

                            <li><hr class="dropdown-divider"></li>

                            <li>
                                <a class="dropdown-item rounded-3 py-2" th:href="@{/user/dashboard}">
                                    <i class="fa-solid fa-chalkboard-user me-2 text-success"></i> Bàn Học Cá Nhân
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item rounded-3 py-2" th:href="@{/user/profile}">
                                    <i class="fa-solid fa-user-gear me-2 text-secondary"></i> Cài Đặt Hồ Sơ
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item rounded-3 py-2 text-danger">
                                        <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Đăng Xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
