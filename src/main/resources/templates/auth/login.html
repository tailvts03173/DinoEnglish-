<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Đăng Nhập - Dino English')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card card-dino p-4 p-md-5 border-0 shadow">
                    <!-- Dino Mascot Brand -->
                    <div class="text-center mb-4">
                        <img th:src="@{/images/dino-logo.png}" alt="Dino Logo" style="height: 90px;" class="mb-2">
                        <h2 class="fw-bold mb-1">Đăng Nhập</h2>
                        <p class="text-secondary small">Chào mừng bạn trở lại với Dino English!</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show rounded-4 small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show rounded-4 small" role="alert">
                        <i class="fa-solid fa-circle-check me-2"></i>
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${infoMessage != null}" class="alert alert-info alert-dismissible fade show rounded-4 small" role="alert">
                        <i class="fa-solid fa-circle-info me-2"></i>
                        <span th:text="${infoMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post" id="loginForm">
                        <div class="mb-3">
                            <label for="usernameOrEmail" class="form-label fw-bold small text-secondary">Tên đăng nhập hoặc Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" class="form-control bg-light border-start-0 rounded-end-pill py-2" id="usernameOrEmail" name="usernameOrEmail"
                                       th:value="${enteredUsername}" placeholder="Nhập username hoặc email..." required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label fw-bold small text-secondary">Mật khẩu</label>
                                <a th:href="@{/forgot-password}" class="small text-decoration-none text-dino-green">Quên mật khẩu?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 rounded-end-pill py-2" id="password" name="password"
                                       placeholder="Nhập mật khẩu..." required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dino w-100 py-2 mt-2">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng Nhập
                        </button>
                    </form>

                    <!-- Fast Demo Logins Helper -->
                    <div class="mt-4 pt-3 border-top text-center">
                        <p class="small text-muted fw-bold mb-2"><i class="fa-solid fa-bolt text-warning me-1"></i> Dùng thử với tài khoản học viên mẫu:</p>
                        <div class="d-flex flex-wrap gap-2 justify-content-center">
                            <button type="button" class="btn btn-sm btn-outline-success rounded-pill" onclick="fillLogin('dino_learner', '123456')">
                                <i class="fa-solid fa-paw me-1"></i> Học Viên
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4 small text-secondary">
                        Chưa có tài khoản?
                        <a th:href="@{/register}" class="fw-bold text-dino-green text-decoration-none">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
function fillLogin(username, password) {
    document.getElementById('usernameOrEmail').value = username;
    document.getElementById('password').value = password;
}
</script>
</body>
</html>
