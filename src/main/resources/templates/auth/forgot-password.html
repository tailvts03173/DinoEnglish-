<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Quên Mật Khẩu - Dino English')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card card-dino p-4 p-md-5 border-0 shadow">
                    <div class="text-center mb-4">
                        <img th:src="@{/images/dino-logo.png}" alt="Dino Logo" style="height: 80px;" class="mb-2">
                        <h2 class="fw-bold mb-1">Quên Mật Khẩu</h2>
                        <p class="text-secondary small" th:if="${step == null or step == 1}">Nhập email tài khoản của bạn, Dino sẽ gửi một mã xác minh 6 số để đặt lại mật khẩu.</p>
                        <p class="text-secondary small" th:if="${step == 2}">Nhập mã xác minh trong email và đặt mật khẩu mới.</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show rounded-4 small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${infoMessage != null}" class="alert alert-info rounded-4 small" role="alert">
                        <i class="fa-solid fa-envelope-circle-check me-2"></i>
                        <span th:text="${infoMessage}"></span>
                    </div>
                    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show rounded-4 small" role="alert">
                        <i class="fa-solid fa-circle-check me-2"></i>
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Bước 1: nhập email -->
                    <form th:if="${step == null or step == 1}" th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold small text-secondary">Email đã đăng ký</label>
                            <input type="email" class="form-control rounded-pill py-2" id="email" name="email"
                                   placeholder="email@example.com" required>
                        </div>
                        <button type="submit" class="btn btn-dino w-100 py-2 mt-2">
                            <i class="fa-solid fa-paper-plane me-2"></i> Gửi Mã Xác Minh
                        </button>
                    </form>

                    <!-- Bước 2: nhập mã + mật khẩu mới -->
                    <form th:if="${step == 2}" th:action="@{/forgot-password/reset}" method="post">
                        <input type="hidden" name="email" th:value="${email}">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">Email</label>
                            <input type="text" class="form-control rounded-pill py-2" th:value="${email}" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="code" class="form-label fw-bold small text-secondary">Mã xác minh (6 số)</label>
                            <input type="text" class="form-control rounded-pill py-2 text-center fw-bold" id="code" name="code"
                                   inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"
                                   placeholder="••••••" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-bold small text-secondary">Mật khẩu mới</label>
                            <input type="password" class="form-control rounded-pill py-2" id="newPassword" name="newPassword"
                                   minlength="6" maxlength="72" placeholder="Tối thiểu 6 ký tự" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-bold small text-secondary">Nhập lại mật khẩu mới</label>
                            <input type="password" class="form-control rounded-pill py-2" id="confirmPassword" name="confirmPassword"
                                   minlength="6" maxlength="72" placeholder="Nhập lại mật khẩu mới" required>
                        </div>
                        <button type="submit" class="btn btn-dino w-100 py-2 mt-2">
                            <i class="fa-solid fa-key me-2"></i> Đặt Lại Mật Khẩu
                        </button>
                        <div class="text-center mt-3 small">
                            <a th:href="@{/forgot-password}" class="text-decoration-none text-muted">Chưa nhận được mã? Gửi lại</a>
                        </div>
                    </form>

                    <div class="text-center mt-4 small text-secondary">
                        <a th:href="@{/login}" class="text-decoration-none text-muted">
                            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
